<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ouverture — banc d'essai</title>
  <style>
    html, body { margin: 0; background: #0a0e14; color: #eef2f6; font: 14px/1.5 system-ui, sans-serif; }
    #bar { padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    canvas { width: 100%; display: block; }
    #msg { color: #b7c2cf; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>Ouverture — image fixe</strong>
    <label>GPX <input type="file" id="gpx" accept=".gpx" /></label>
    <label>Titre <input id="title" value="Semi-marathon 2026" /></label>
    <label>Ville <input id="city" value="Lille" /></label>
    <label>Date <input id="date" value="17 septembre 2026" /></label>
    <label>D+ <input id="gain" type="number" value="50" style="width:4em" /></label>
    <label>Lieux (nom;lat;lon[;poi ou district[;fort, gate, arena, park, monument]], un par ligne) <textarea id="pois" rows="2" cols="34">Citadelle de Lille;50.6403;3.0446;poi;fort
Porte de Paris;50.6311;3.0705;poi;gate
Nouveau Siècle;50.6378;3.0596;poi;monument
Le Zénith;50.6328;3.0759;poi;arena
Vauban;50.6365;3.0480;district
Wazemmes;50.6265;3.0490;district
Vieux-Lille;50.6420;3.0640;district
Moulins;50.6200;3.0700;district
Fives;50.6290;3.0870;district</textarea></label>
    <button id="go">Rendre</button>
    <button id="play">Animer</button>
    <button id="png">Télécharger l'image</button>
    <span id="msg"></span>
  </div>
  <canvas id="out" width="1920" height="1080"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
