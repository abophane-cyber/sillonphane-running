<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Prototype terrain 3D — Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; }
    #titlebar {
      position: absolute; top: 16px; left: 18px; z-index: 10;
      pointer-events: none; color: #fff; white-space: nowrap;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65);
      font: 800 22px/1.2 system-ui, sans-serif;
    }
    #titlebar .date { font-weight: 600; font-size: 16px; color: #eef2f6; letter-spacing: .05em;
      text-transform: uppercase; }
    #replay {
      position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
      z-index: 10; display: none;
      font: 600 13px/1 system-ui, sans-serif; color: #fff;
      background: rgba(0,0,0,0.5); padding: 9px 14px; border-radius: 999px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
    }
    #speed {
      position: absolute; left: 18px; top: 54px; z-index: 11;
      display: flex; align-items: center; gap: 9px;
      font: 600 12px/1 system-ui, sans-serif; color: #fff;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 10px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.55);
    }
    #speed input { width: 130px; accent-color: #e07b3c; cursor: pointer; }
    #speed .val { min-width: 32px; text-align: right; }
    #watermark {
      position: absolute; right: 40px; bottom: 46px; z-index: 10; display: none;
      font: 700 20px/1 system-ui, sans-serif; color: #fff; letter-spacing: .02em;
      opacity: 0.62; text-shadow: 0 1px 4px rgba(0,0,0,0.6); pointer-events: none;
    }
    #distance-badge {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 10; background: #e31c1c; color: #fff; font: 800 20px/1 system-ui, sans-serif;
      padding: 10px 20px; border-radius: 999px; box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      pointer-events: none; display: none; white-space: nowrap;
    }
    #profile {
      position: absolute; left: 16px; bottom: 16px; z-index: 10;
      background: rgba(0,0,0,0.62); padding: 14px 17px 12px; border-radius: 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.45); pointer-events: none;
      font: 15.5px/1.35 system-ui, sans-serif; color: #f2f5f8; display: none;
    }
    #profile .title { font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      font-size: 13px; color: #e9eef3; margin-bottom: 7px; }
    #profile .stats { margin-top: 7px; font-size: 16.5px; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
    #profile .stats b { color: #fff; font-weight: 400; }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar"></div>
    <div id="distance-badge"></div>
    <div id="profile"></div>
    <div id="speed">
      <span>Vitesse</span>
      <input type="range" id="speed-range" min="0.4" max="2.2" step="0.05" value="1" />
      <span class="val" id="speed-val">1.0×</span>
    </div>
    <div id="replay">↻ Cliquer ou Espace pour rejouer</div>
    <div id="watermark">sillonphane.fr/rando</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
